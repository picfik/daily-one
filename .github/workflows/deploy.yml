# 每次推送到 main 时：注入 OSS AccessKey（来自仓库 Secret）→ 发布到 GitHub Pages
# 前提：仓库 Settings → Secrets and variables → Actions 中已添加
#   OSS_ACCESS_KEY_ID 和 OSS_ACCESS_KEY_SECRET 两个 Secret
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 避免连续推送时并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 注入 OSS AccessKey 到 app.js
        run: |
          sed -i "s|YOUR_RAM_ACCESS_KEY_ID|${OSS_ACCESS_KEY_ID}|g" app.js
          sed -i "s|YOUR_RAM_ACCESS_KEY_SECRET|${OSS_ACCESS_KEY_SECRET}|g" app.js
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: 校验注入结果（Secrets 缺失时使部署失败，防止裸占位符上线）
        run: |
          if grep -q "YOUR_RAM_ACCESS_KEY" app.js; then
            echo "::error::app.js 中仍有占位符，请检查 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 两个 Secret 是否已配置"
            exit 1
          fi

      - name: 打包静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
